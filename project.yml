name: Remotely
options:
  createIntermediateGroups: true
schemes:
  RemotelyMac:
    build:
      targets:
        RemotelyMac: all
  RemotelyiOS:
    build:
      targets:
        RemotelyiOS: all
# DEVELOPMENT_TEAM comes from the environment so no personal team ID lives in
# the repo: run `env $(cat .env) xcodegen generate` for a signed setup.
# Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps TestFlight builds unique).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RemotelyMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: Remotely advertises this Mac on the local network so your iPhone or iPad can find it and connect.
        NSBonjourServices: ["_remotely._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xleddyl.remotely.mac
        PRODUCT_NAME: Remotely
        BUNDLE_DISPLAY_NAME: Remotely
        SWIFT_OBJC_BRIDGING_HEADER: Mac/RemotelyMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/RemotelyMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # The distinct display name keeps the two telling apart in the
        # System Settings permission lists.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.xleddyl.remotely.mac.debug
          BUNDLE_DISPLAY_NAME: Remotely Dev
    postBuildScripts:
      - name: Stamp archive build number
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ACTION" = "install" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date +%y%m%d%H%M)" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
  RemotelyiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Remotely
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Remotely looks for your Mac on the local network.
        NSBonjourServices: ["_remotely._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIAppFonts: ["MontserratAlternates-Bold.ttf"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xleddyl.remotely.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Stamp archive build number
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ACTION" = "install" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date +%y%m%d%H%M)" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
